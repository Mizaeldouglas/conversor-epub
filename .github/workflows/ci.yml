name: Testes e publicação

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Dependências
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium

      - name: EPUBCheck
        run: |
          curl -sSL -o epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.1.0/epubcheck-5.1.0.zip
          unzip -q epubcheck.zip
          echo "EPUBCHECK_JAR=$PWD/epubcheck-5.1.0/epubcheck.jar" >> "$GITHUB_ENV"

      - name: index.html em dia com src/
        run: npm run check

      - name: Testes
        run: npm test

      - name: EPUBs gerados nos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epubs-dos-testes
          path: tests/saida/
          if-no-files-found: ignore

      - name: Monta o site
        run: |
          mkdir _site
          cp -r index.html privacidade.html sw.js manifest.webmanifest icon-192.png icon-512.png og.png ocr _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: testes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # só publica por aqui se o Pages estiver configurado para "GitHub Actions";
      # enquanto publicar direto da branch main, o próprio GitHub publica a cada push
      - name: Modo do GitHub Pages
        id: modo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tipo=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo desconhecido)
          echo "tipo=$tipo" >> "$GITHUB_OUTPUT"
          if [ "$tipo" != "workflow" ]; then
            {
              echo "### Publicação feita pelo próprio GitHub Pages"
              echo "O Pages está publicando direto da branch \`main\` (modo: $tipo), mesmo se os testes falharem."
              echo "Para publicar só quando os testes passarem: **Settings > Pages > Build and deployment > Source: GitHub Actions**."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publica
        id: deploy
        if: steps.modo.outputs.tipo == 'workflow'
        uses: actions/deploy-pages@v4
